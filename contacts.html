<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts Management</title>
  <link rel="stylesheet" href="contacts.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>Contact Management System</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h2>Manage Contacts</h2>

    <!-- Add Contact Form -->
    <form id="addContactForm" class="form">
      <h3>Add New Contact</h3>
      <input type="text" id="name" placeholder="Name" required>
      <input type="text" id="company" placeholder="Company Name" required>
      <input type="text" id="event" placeholder="Event Name" required>
      <input type="text" id="role" placeholder="Role of Chief Guest" required>
      <input type="text" id="phone" placeholder="Phone Number" required>
      <input type="email" id="email" placeholder="Email ID" required>
      <input type="text" id="address" placeholder="Company Address" required>
      <input type="date" id="date" placeholder="Event Date" required>
      <input type="time" id="startTime" placeholder="Start Time" required>
      <input type="time" id="endTime" placeholder="End Time" required>
      <textarea id="topic" placeholder="Topics Discussed in the Event" rows="3" required></textarea>
      <select id="type" required>
        <option value="" disabled selected>Select Event Type</option>
        <option value="Internal">Internal</option>
        <option value="External">External</option>
      </select>
      <button type="button" class="add-btn" onclick="addContact()">Add Contact</button>
    </form>

    <!-- Contact List -->
    <div class="contacts">
      <h3>Contact List</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Phone</th>
            <th>Event Type</th>
            <th>Event Name</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactList">
          <!-- Contacts will be dynamically inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="contacts.js"></script>
</body>
</html>
